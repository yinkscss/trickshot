<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Trick Shot — Playable Pitch</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #cfd1d6;
      font-family: "Nunito", system-ui, sans-serif;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .app {
      height: 100%;
      display: grid;
      grid-template-columns: minmax(0, 300px) 1fr;
    }
    @media (max-width: 780px) {
      .app { grid-template-columns: 1fr; }
      .side { display: none; }
    }
    .side {
      background: #16181e;
      color: #e8ebf2;
      padding: 1.4rem 1.15rem;
      overflow-y: auto;
    }
    .side .tag {
      font-size: 0.66rem;
      font-weight: 800;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #4ecbff;
      margin-bottom: 0.55rem;
    }
    .side h1 {
      font-size: 1.7rem;
      font-weight: 900;
      line-height: 1;
      margin-bottom: 0.65rem;
    }
    .side h1 span { color: #ff4d1a; }
    .side p, .side li {
      font-size: 0.82rem;
      line-height: 1.45;
      color: #9aa3b5;
    }
    .side p { margin-bottom: 0.9rem; }
    .side ol { margin: 0 0 1rem 1.05rem; }
    .side li { margin-bottom: 0.35rem; }
    .side a { color: #4ecbff; font-weight: 700; font-size: 0.82rem; text-decoration: none; }
    .stage {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(180deg, #e4e5e9, #c8cbd2);
      padding: 10px;
    }
    .phone {
      width: min(400px, 100%);
      height: min(840px, 100%);
      aspect-ratio: 9 / 19.5;
      background: #e8e8ea;
      border-radius: 30px;
      box-shadow: 0 0 0 9px #111318, 0 0 0 11px #444954, 0 26px 55px rgba(0,0,0,.35);
      overflow: hidden;
      position: relative;
    }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab; }
    canvas:active { cursor: grabbing; }
  </style>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="tag">Playable pitch</div>
      <h1>TRICK <span>SHOT</span></h1>
      <p>Drag opposite the shot, release, chain dunks. Built to match Dunk Shot–style juice: mesh nets, marble ball, cyan fire, orange aim dots.</p>
      <ol>
        <li><strong>Drag</strong> the ball (pull back to aim).</li>
        <li><strong>Release</strong> along the orange dots.</li>
        <li><strong>Swish</strong> to chain. Miss → continue.</li>
      </ol>
      <p><a href="prd.html">← HTML PRD</a></p>
    </aside>
    <div class="stage">
      <div class="phone" id="phone"><canvas id="game"></canvas></div>
    </div>
  </div>
<script>
(() => {
  const canvas = document.getElementById("game");
  const ctx = canvas.getContext("2d");

  const COURT = "#e8e8ea";
  const ORANGE = "#ff4d1a";
  const GREY = "#6a6f78";
  const CYAN = "#4ecbff";
  const STAR = "#ffc400";
  const STAR_LINE = "#ff9800";

  let W = 390, H = 780, DPR = 1;
  const G = 2000;
  const BR = 15;
  const RX = 42;
  const RY = 14;
  const MAX_POW = 1180;

  const S = {
    mode: "aim",
    score: 0,
    stars: 0,
    ball: { x: 0, y: 0, vx: 0, vy: 0 },
    source: null,
    target: null,
    star: null,
    starOn: true,
    drag: false,
    dragPt: null,
    aim: { x: 0, y: 0 },
    trail: [],
    rings: [],
    fx: [],
    ghosts: [],
    shake: 0,
    flash: 0,
    contA: 0,
    showHint: true,
    scoredAt: 0,
  };

  function resize() {
    const r = document.getElementById("phone").getBoundingClientRect();
    DPR = Math.min(devicePixelRatio || 1, 2);
    W = r.width;
    H = r.height;
    canvas.width = (W * DPR) | 0;
    canvas.height = (H * DPR) | 0;
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const hypot = Math.hypot;

  function hoop(x, y, ang) {
    return { x, y, ang, wobble: 0 };
  }

  function place(fromScore) {
    let sx, sy, tx, ty, ang;
    if (fromScore === 0) {
      sx = W * 0.36; sy = H * 0.60;
      tx = W * 0.68; ty = H * 0.34;
      ang = -0.42;
    } else {
      sx = S.ball.x; sy = S.ball.y + 6;
      const goLeft = Math.random() < 0.5;
      tx = goLeft ? rand(W * 0.18, W * 0.40) : rand(W * 0.60, W * 0.82);
      ty = clamp(sy - rand(110, 230), H * 0.20, H * 0.70);
      if (hypot(tx - sx, ty - sy) < 150) {
        tx = sx < W / 2 ? W * 0.74 : W * 0.26;
        ty = clamp(sy - 170, H * 0.22, H * 0.65);
      }
      ang = (tx > sx ? -1 : 1) * rand(0.2, 0.55);
    }
    S.source = hoop(sx, sy, ang * 0.25);
    S.target = hoop(tx, ty, ang);
    S.star = { x: tx + Math.sin(ang) * 4, y: ty - 30 };
    S.starOn = true;
    S.ball.x = sx;
    S.ball.y = sy - 1;
    S.ball.vx = 0;
    S.ball.vy = 0;
    S.trail = [];
    S.rings = [];
    S.mode = "aim";
    S.aim = { x: 0, y: 0 };
    S.drag = false;
    S.scoredAt = 0;
  }

  function reset() {
    S.score = 0; S.stars = 0; S.fx = []; S.ghosts = [];
    S.contA = 0; S.showHint = true;
    place(0);
  }

  // ——— Drawing: authentic hoop (back rim → net → front rim) ———
  function drawHoop(h, color, opts = {}) {
    const { withBall = false, ballY = 0 } = opts;
    const { x, y, ang } = h;
    const wob = h.wobble || 0;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(ang);

    // Soft ground shadow
    ctx.beginPath();
    ctx.ellipse(3, 8, RX * 0.95, RY * 0.9, 0, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.07)";
    ctx.fill();

    // BACK half of rim (drawn first)
    ctx.beginPath();
    ctx.ellipse(0, 0, RX, RY, 0, Math.PI, 0, true);
    ctx.strokeStyle = color;
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.stroke();

    // NET — white mesh bag hanging below rim
    drawNetMesh(wob);

    // Ball sits in hoop (between net and front rim)
    if (withBall) {
      ctx.restore();
      drawFireAura(S.ball.x, S.ball.y, BR);
      drawMarble(S.ball.x, S.ball.y, BR);
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(ang);
    }

    // FRONT half of rim (on top of ball)
    ctx.beginPath();
    ctx.ellipse(0, 0, RX, RY, 0, 0, Math.PI, false);
    ctx.strokeStyle = color;
    ctx.lineWidth = 7;
    ctx.lineCap = "round";
    ctx.stroke();

    // Rim gloss on front
    ctx.beginPath();
    ctx.ellipse(0, 0, RX * 0.9, RY * 0.7, 0, 0.15, Math.PI - 0.15);
    ctx.strokeStyle = "rgba(255,255,255,0.28)";
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.restore();
  }

  function drawNetMesh(wob) {
    // Dunk Shot–style soft white pouch under the rim
    const depth = 40 + wob * 12;
    ctx.save();

    ctx.beginPath();
    ctx.moveTo(-RX * 0.9, 1);
    ctx.bezierCurveTo(-RX * 0.55, depth * 0.55, -RX * 0.35, depth, 0, depth + 2);
    ctx.bezierCurveTo(RX * 0.35, depth, RX * 0.55, depth * 0.55, RX * 0.9, 1);
    ctx.closePath();
    ctx.fillStyle = "rgba(255,255,255,0.35)";
    ctx.fill();

    ctx.strokeStyle = "rgba(255,255,255,0.98)";
    ctx.lineWidth = 2.2;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";

    // Outer net silhouette
    ctx.beginPath();
    ctx.moveTo(-RX * 0.88, RY * 0.1);
    ctx.quadraticCurveTo(-RX * 0.25, depth * 0.7 + wob * 4, 0, depth + wob * 6);
    ctx.quadraticCurveTo(RX * 0.25, depth * 0.7 + wob * 4, RX * 0.88, RY * 0.1);
    ctx.stroke();

    // Vertical cords
    for (let i = 0; i < 7; i++) {
      const t = i / 6;
      const topX = -RX * 0.82 + t * RX * 1.64;
      const botX = -RX * 0.28 + t * RX * 0.56;
      ctx.beginPath();
      ctx.moveTo(topX, RY * 0.2);
      ctx.quadraticCurveTo(topX * 0.55, depth * 0.55 + wob * 3, botX, depth * 0.92 + wob * 5);
      ctx.stroke();
    }

    // Horizontal loops
    for (let r = 1; r <= 4; r++) {
      const tt = r / 4.6;
      const yy = RY * 0.35 + tt * depth * 0.85 + wob * r;
      const spread = RX * (0.8 - tt * 0.48);
      ctx.beginPath();
      ctx.moveTo(-spread, yy);
      ctx.quadraticCurveTo(0, yy + 3 + wob, spread, yy);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawFireAura(x, y, r) {
    const t = performance.now() / 1000;
    // Soft bloom — keep it under the rim so grey/orange steel still reads
    const g = ctx.createRadialGradient(x, y, r * 0.15, x, y, r * 2.6);
    g.addColorStop(0, "rgba(78,203,255,0.4)");
    g.addColorStop(0.4, "rgba(40,120,255,0.16)");
    g.addColorStop(1, "rgba(40,120,255,0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, r * 2.6, 0, Math.PI * 2);
    ctx.fill();

    // Horizontal fire rings mostly below the ball (Dunk Shot charge look)
    for (let i = 0; i < 4; i++) {
      const pulse = Math.sin(t * 9 + i * 1.1) * 0.5 + 0.5;
      const yy = y + r * 0.55 + i * 7 + pulse * 2;
      const rx = r * (1.15 + i * 0.32 + pulse * 0.12);
      ctx.beginPath();
      ctx.ellipse(x, yy, rx, 2.8 + i * 0.35, 0, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(78,203,255,${0.6 - i * 0.11})`;
      ctx.lineWidth = 2.2;
      ctx.stroke();
      ctx.beginPath();
      ctx.ellipse(x, yy, rx * 0.65, 1.5, 0, 0, Math.PI * 2);
      ctx.strokeStyle = `rgba(200,240,255,${0.4 - i * 0.07})`;
      ctx.lineWidth = 1.2;
      ctx.stroke();
    }
  }

  function drawMarble(x, y, r) {
    const g = ctx.createRadialGradient(x - r * 0.35, y - r * 0.4, r * 0.08, x, y, r);
    g.addColorStop(0, "#d4efff");
    g.addColorStop(0.22, "#6eb6ff");
    g.addColorStop(0.55, "#1e5fff");
    g.addColorStop(0.82, "#1540c0");
    g.addColorStop(1, "#0a2878");
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fillStyle = g;
    ctx.fill();

    // Facet-ish stripes like glossy marble ball
    ctx.save();
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.clip();
    ctx.strokeStyle = "rgba(255,255,255,0.18)";
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x - r * 0.2, y, r * 0.9, -0.8, 1.2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(x + r * 0.15, y + r * 0.1, r * 0.75, 2.2, 4.2);
    ctx.stroke();
    ctx.restore();

    // Specular
    ctx.beginPath();
    ctx.ellipse(x - r * 0.3, y - r * 0.35, r * 0.28, r * 0.16, -0.6, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.7)";
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(100,180,255,0.55)";
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }

  function drawStarIcon(x, y, r, rot = 0) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a = -Math.PI / 2 + (i * 2 * Math.PI) / 5;
      const a2 = a + Math.PI / 5;
      ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
      ctx.lineTo(Math.cos(a2) * r * 0.42, Math.sin(a2) * r * 0.42);
    }
    ctx.closePath();
    ctx.fillStyle = STAR;
    ctx.strokeStyle = STAR_LINE;
    ctx.lineWidth = 2;
    ctx.fill();
    ctx.stroke();
    ctx.restore();
  }

  function drawTrail() {
    // Draw oldest first so tip (near ball) stays brightest
    for (let i = 0; i < S.trail.length; i++) {
      const p = S.trail[i];
      const age = 1 - i / Math.max(1, S.trail.length);
      const s = 7 + p.life * 14 * (0.55 + age * 0.6);
      const stretch = 1.35 + (1 - p.life) * 0.8;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.globalAlpha = p.life * 0.85;
      ctx.fillStyle = i % 2 === 0 ? CYAN : "#8adfff";
      ctx.beginPath();
      // Elongated diamond / kite — the “fire” streak
      ctx.moveTo(0, -s * stretch);
      ctx.lineTo(s * 0.62, 0);
      ctx.lineTo(0, s * 0.85);
      ctx.lineTo(-s * 0.62, 0);
      ctx.closePath();
      ctx.fill();
      // Bright core
      ctx.globalAlpha = p.life * 0.5;
      ctx.fillStyle = "#e8f7ff";
      ctx.beginPath();
      ctx.moveTo(0, -s * 0.55);
      ctx.lineTo(s * 0.28, 0);
      ctx.lineTo(0, s * 0.35);
      ctx.lineTo(-s * 0.28, 0);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }
    for (const r of S.rings) {
      ctx.globalAlpha = r.a;
      ctx.strokeStyle = CYAN;
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.rx, r.ry, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.strokeStyle = "rgba(200,240,255,0.7)";
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.ellipse(r.x, r.y, r.rx * 0.65, r.ry * 0.65, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }

  function predictDots(vx, vy) {
    if (hypot(vx, vy) < 50) return;
    let x = S.ball.x, y = S.ball.y, tvx = vx, tvy = vy;
    const dt = 1 / 50;
    for (let i = 0; i < 20; i++) {
      for (let k = 0; k < 2; k++) {
        tvy += G * dt;
        x += tvx * dt;
        y += tvy * dt;
      }
      const fade = 1 - i / 20;
      ctx.beginPath();
      ctx.arc(x, y, 2.2 + 2.2 * fade, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,77,26,${0.95 * fade})`;
      ctx.fill();
      if (y > H + 30 || x < -40 || x > W + 40) break;
    }
  }

  function drawHint() {
    if (!S.showHint || S.mode !== "aim" || S.drag) return;
    const x = S.ball.x;
    const y = S.ball.y + 58;
    const bob = Math.sin(performance.now() / 220) * 6;
    ctx.save();
    ctx.translate(x, y + bob);
    // Finger
    ctx.strokeStyle = "#9aa0aa";
    ctx.lineWidth = 3;
    ctx.lineCap = "round";
    ctx.beginPath();
    ctx.moveTo(0, -10);
    ctx.lineTo(0, 8);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(0, -14, 5, Math.PI, 0);
    ctx.stroke();
    // Arrow
    ctx.beginPath();
    ctx.moveTo(-6, 14);
    ctx.lineTo(0, 22);
    ctx.lineTo(6, 14);
    ctx.stroke();
    ctx.font = "800 15px Nunito, sans-serif";
    ctx.fillStyle = "#9aa0aa";
    ctx.textAlign = "center";
    ctx.fillText("DRAG IT!", 0, 42);
    ctx.restore();
  }

  function drawHUD() {
    ctx.fillStyle = "#a4a8b0";
    ctx.fillRect(20, 26, 5, 20);
    ctx.fillRect(30, 26, 5, 20);

    ctx.font = `900 ${Math.floor(W * 0.4)}px Nunito, sans-serif`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "rgba(110,114,124,0.16)";
    ctx.fillText(String(S.score), W / 2, H * 0.26);

    ctx.font = "800 22px Nunito, sans-serif";
    ctx.fillStyle = "#555964";
    ctx.textAlign = "right";
    ctx.fillText(String(S.stars), W - 48, 38);
    drawStarIcon(W - 26, 38, 10, 0);
  }

  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function drawContinue() {
    if (S.mode !== "continue") { S.contA = Math.max(0, S.contA - 0.08); if (S.contA <= 0) return; }
    else S.contA = Math.min(1, S.contA + 0.08);
    ctx.save();
    ctx.globalAlpha = S.contA * 0.5;
    ctx.fillStyle = "#000";
    ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = S.contA;
    const cw = W * 0.74, ch = 158, cx = W / 2, cy = H / 2;
    roundRect(cx - cw / 2, cy - ch / 2, cw, ch, 20);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.fillStyle = "#1a1c22";
    ctx.font = "900 32px Nunito, sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("CONTINUE?", cx, cy - 30);
    ctx.font = "700 13px Nunito, sans-serif";
    ctx.fillStyle = "#808698";
    ctx.fillText("Tap to keep your chain", cx, cy + 0);
    roundRect(cx - 72, cy + 26, 144, 42, 12);
    ctx.fillStyle = ORANGE;
    ctx.fill();
    ctx.fillStyle = "#fff";
    ctx.font = "800 16px Nunito, sans-serif";
    ctx.fillText("0.49 cUSD", cx, cy + 50);
    ctx.restore();
  }

  function burst(x, y, color, n = 14) {
    for (let i = 0; i < n; i++) {
      const a = (Math.PI * 2 * i) / n + rand(-0.2, 0.2);
      const sp = rand(140, 360);
      S.fx.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, color, r: rand(2.2, 4.5) });
    }
  }

  // ——— Physics ———
  function local(h, x, y) {
    const dx = x - h.x, dy = y - h.y;
    const c = Math.cos(-h.ang), s = Math.sin(-h.ang);
    return { x: dx * c - dy * s, y: dx * s + dy * c };
  }

  function throughHoop(h) {
    const b = S.ball;
    const L = local(h, b.x, b.y);
    const nx = L.x / (RX * 0.85);
    const ny = L.y / (RY * 1.35);
    if (nx * nx + ny * ny > 1) return false;
    return hypot(b.vx, b.vy) > 70;
  }

  function rimHit(h) {
    const b = S.ball;
    const L = local(h, b.x, b.y);
    const dist = Math.sqrt((L.x * L.x) / (RX * RX) + (L.y * L.y) / (RY * RY));
    if (dist < 0.78 || dist > 1.2) return;
    if (Math.abs(dist - 1) > 0.14) return;

    let nx = L.x / (RX * RX), ny = L.y / (RY * RY);
    const nl = hypot(nx, ny) || 1;
    nx /= nl; ny /= nl;

    const c = Math.cos(-h.ang), s = Math.sin(-h.ang);
    let lvx = b.vx * c - b.vy * s;
    let lvy = b.vx * s + b.vy * c;
    const vn = lvx * nx + lvy * ny;
    if (vn >= 0) return;
    lvx -= 1.55 * vn * nx;
    lvy -= 1.55 * vn * ny;
    lvx *= 0.7; lvy *= 0.7;
    const c2 = Math.cos(h.ang), s2 = Math.sin(h.ang);
    b.vx = lvx * c2 - lvy * s2;
    b.vy = lvx * s2 + lvy * c2;
    h.wobble = 1;
  }

  function onScore() {
    if (S.scoredAt) return;
    S.scoredAt = performance.now();
    S.mode = "scored";
    S.score += 1;
    S.target.wobble = 1.4;
    S.shake = 7;
    S.flash = 1;
    burst(S.target.x, S.target.y, CYAN, 12);
    burst(S.target.x, S.target.y, ORANGE, 8);

    if (S.starOn) {
      S.starOn = false;
      S.stars += 1;
      burst(S.star.x, S.star.y, STAR, 12);
    }

    for (let i = 0; i < 5; i++) {
      S.ghosts.push({
        x: S.target.x - (i + 1) * 7,
        y: S.target.y + (i + 1) * 4,
        ang: S.target.ang,
        a: 0.4 - i * 0.07,
        life: 0.55,
      });
    }

    S.ball.vx *= 0.1;
    S.ball.vy *= 0.1;

    setTimeout(() => {
      S.ball.x = S.target.x;
      S.ball.y = S.target.y - 1;
      place(S.score);
    }, 300);
  }

  function aimFrom(from, to) {
    let dx = from.x - to.x, dy = from.y - to.y;
    const len = hypot(dx, dy);
    const pull = clamp(len, 0, 150);
    const pow = (pull / 150) * MAX_POW;
    if (len < 1) return { x: 0, y: 0 };
    return { x: (dx / len) * pow, y: (dy / len) * pow };
  }

  function ptr(e) {
    const r = canvas.getBoundingClientRect();
    const t = e.touches ? e.touches[0] : e;
    return {
      x: ((t.clientX - r.left) / r.width) * W,
      y: ((t.clientY - r.top) / r.height) * H,
    };
  }

  function down(e) {
    e.preventDefault();
    if (S.mode === "continue") {
      place(S.score);
      S.mode = "aim";
      S.contA = 0;
      return;
    }
    if (S.mode !== "aim") return;
    const p = ptr(e);
    if (hypot(p.x - S.ball.x, p.y - S.ball.y) > 90) return;
    S.drag = true;
    S.dragPt = p;
    S.aim = aimFrom({ x: S.ball.x, y: S.ball.y }, p);
    S.showHint = false;
  }
  function move(e) {
    e.preventDefault();
    if (!S.drag || S.mode !== "aim") return;
    S.dragPt = ptr(e);
    S.aim = aimFrom({ x: S.ball.x, y: S.ball.y }, S.dragPt);
  }
  function up(e) {
    e.preventDefault();
    if (!S.drag || S.mode !== "aim") return;
    S.drag = false;
    if (hypot(S.aim.x, S.aim.y) < 200) {
      S.aim = { x: 0, y: 0 };
      if (S.score === 0) S.showHint = true;
      return;
    }
    S.ball.vx = S.aim.x;
    S.ball.vy = S.aim.y;
    S.mode = "flying";
    for (let i = 0; i < 5; i++) {
      S.rings.push({
        x: S.ball.x,
        y: S.ball.y + 8 + i * 7,
        rx: 12 + i * 6,
        ry: 3 + i * 0.8,
        a: 0.75 - i * 0.12,
      });
    }
    burst(S.ball.x, S.ball.y, CYAN, 8);
    S.aim = { x: 0, y: 0 };
  }

  canvas.addEventListener("mousedown", down);
  window.addEventListener("mousemove", move);
  window.addEventListener("mouseup", up);
  canvas.addEventListener("touchstart", down, { passive: false });
  window.addEventListener("touchmove", move, { passive: false });
  window.addEventListener("touchend", up, { passive: false });

  let last = performance.now();

  function update(dt) {
    dt = Math.min(dt, 0.033);
    for (const p of S.fx) {
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 420 * dt; p.life -= dt * 1.9;
    }
    S.fx = S.fx.filter((p) => p.life > 0);
    for (const g of S.ghosts) g.life -= dt;
    S.ghosts = S.ghosts.filter((g) => g.life > 0);
    for (const r of S.rings) { r.rx += 50 * dt; r.ry += 12 * dt; r.a -= dt * 1.8; }
    S.rings = S.rings.filter((r) => r.a > 0);
    if (S.source) S.source.wobble *= Math.pow(0.04, dt);
    if (S.target) S.target.wobble *= Math.pow(0.06, dt);
    S.shake *= Math.pow(0.008, dt);
    S.flash *= Math.pow(0.015, dt);
    for (const t of S.trail) { t.life -= dt * 3; t.rot += dt * 5; }
    S.trail = S.trail.filter((t) => t.life > 0);

    if (S.mode === "aim" && S.source) {
      S.ball.x = S.source.x;
      S.ball.y = S.source.y - 1 + Math.sin(performance.now() / 260) * 1.5;
    }

    if (S.mode === "flying") {
      const b = S.ball;
      b.vy += G * dt;
      b.x += b.vx * dt;
      b.y += b.vy * dt;

      if (hypot(b.vx, b.vy) > 70) {
        // Sample denser trail for thick fire ribbon
        S.trail.push({
          x: b.x - b.vx * 0.008,
          y: b.y - b.vy * 0.008,
          life: 1,
          rot: Math.atan2(b.vy, b.vx),
        });
        S.trail.push({
          x: b.x, y: b.y, life: 1,
          rot: Math.atan2(b.vy, b.vx) + 0.2,
        });
        if (S.trail.length > 40) S.trail.splice(0, S.trail.length - 40);
      }

      rimHit(S.source);
      rimHit(S.target);

      if (S.starOn && hypot(b.x - S.star.x, b.y - S.star.y) < 24) {
        S.starOn = false;
        S.stars += 1;
        burst(S.star.x, S.star.y, STAR, 14);
      }

      if (throughHoop(S.target)) onScore();

      if (b.y > H + 90 || b.x < -120 || b.x > W + 120) {
        S.mode = "continue";
      }
    }
  }

  function draw() {
    const sx = (Math.random() - 0.5) * S.shake;
    const sy = (Math.random() - 0.5) * S.shake;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.fillStyle = COURT;
    ctx.fillRect(-30, -30, W + 60, H + 60);

    drawHUD();

    // Ghost teleports
    for (const g of S.ghosts) {
      ctx.save();
      ctx.globalAlpha = Math.max(0, g.a * (g.life / 0.55));
      ctx.translate(g.x, g.y);
      ctx.rotate(g.ang);
      ctx.beginPath();
      ctx.ellipse(0, 0, RX, RY, 0, 0, Math.PI * 2);
      ctx.strokeStyle = GREY;
      ctx.lineWidth = 6;
      ctx.stroke();
      ctx.restore();
    }

    if (S.starOn) drawStarIcon(S.star.x, S.star.y, 12, performance.now() / 800);

    // Target hoop (empty) first — full draw
    if (S.target) drawHoop(S.target, ORANGE);

    // Source hoop with ball nested in rim depth
    if (S.source) {
      if (S.mode === "aim" || S.mode === "scored") {
        drawHoop(S.source, GREY, { withBall: true });
      } else {
        drawHoop(S.source, GREY);
      }
    }

    drawTrail();

    if (S.mode === "aim" && S.drag) {
      predictDots(S.aim.x, S.aim.y);
      if (S.dragPt) {
        ctx.beginPath();
        ctx.moveTo(S.ball.x, S.ball.y);
        ctx.lineTo(S.dragPt.x, S.dragPt.y);
        ctx.strokeStyle = "rgba(255,77,26,0.3)";
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);
      }
    }

    // Flying / free ball (not nested in source)
    if (S.mode === "flying" || S.mode === "continue") {
      drawMarble(S.ball.x, S.ball.y, BR);
    }

    for (const p of S.fx) {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    drawHint();

    if (S.flash > 0.04) {
      ctx.fillStyle = `rgba(255,255,255,${S.flash * 0.22})`;
      ctx.fillRect(0, 0, W, H);
    }

    ctx.restore();
    drawContinue();
  }

  function loop(now) {
    update((now - last) / 1000);
    last = now;
    draw();
    requestAnimationFrame(loop);
  }

  window.addEventListener("resize", resize);
  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
