<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1c22" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Trick Shot</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        background: #cfd1d6;
        font-family: "Nunito", system-ui, sans-serif;
        overflow: hidden;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        overscroll-behavior: none;
      }
      .stage {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(180deg, #e4e5e9, #c8cbd2);
        padding: 10px;
        padding-top: max(10px, env(safe-area-inset-top));
        padding-right: max(10px, env(safe-area-inset-right));
        padding-bottom: max(10px, env(safe-area-inset-bottom));
        padding-left: max(10px, env(safe-area-inset-left));
      }
      .phone {
        width: min(400px, 100%);
        height: min(840px, 100%);
        aspect-ratio: 9 / 19.5;
        background: #e8e8ea;
        border-radius: 30px;
        box-shadow:
          0 0 0 9px #111318,
          0 0 0 11px #444954,
          0 26px 55px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        position: relative;
      }
      #game {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: grab;
      }
      #game:active {
        cursor: grabbing;
      }
      /* Mobile: full-bleed court (no phone chrome) */
      @media (max-width: 820px) {
        .stage {
          padding: 0;
          background: #e8e8ea;
        }
        .phone {
          width: 100%;
          height: 100%;
          max-width: none;
          max-height: none;
          aspect-ratio: auto;
          border-radius: 0;
          box-shadow: none;
          padding-top: env(safe-area-inset-top);
          padding-right: env(safe-area-inset-right);
          padding-bottom: env(safe-area-inset-bottom);
          padding-left: env(safe-area-inset-left);
        }
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="phone" id="phone">
        <canvas id="game" width="390" height="780"></canvas>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
